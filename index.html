<!doctype html>
<html lang="zh-CN">
  <head>
    <script>
      // Android WebView 的 UA 标志；尽早执行（在样式加载前）避免闪变。
      // 浏览器访问时不会命中，网页表现完全不受影响。
      if (navigator.userAgent.includes('; wv')) {
        document.documentElement.classList.add('app-shell')
      }
    </script>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover 是 env(safe-area-inset-*) 生效的前提；
         interactive-widget=resizes-content 配合壳端 adjustResize（键盘弹起时压缩页面而非遮挡） -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <!-- 合规：本项目不面向公众，禁止搜索引擎收录（见 docs/合规检查清单.md） -->
    <meta name="robots" content="noindex, nofollow" />
    <!-- 内联 SVG 图标：省掉一个静态文件，也避免浏览器请求 /favicon.ico 得到 404 -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%23176b75'/%3E%3Ccircle cx='15' cy='17' r='9' fill='none' stroke='white' stroke-width='2.6'/%3E%3Ccircle cx='15' cy='17' r='2.9' fill='white'/%3E%3Cpath d='M21.5 10.5L25.5 6.5' stroke='white' stroke-width='2.4' stroke-linecap='round'/%3E%3C/svg%3E"
    />
    <meta name="theme-color" content="#f4f5f9" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#080a10" media="(prefers-color-scheme: dark)" />
    <title>SONAR · AI 资讯趋势雷达</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
